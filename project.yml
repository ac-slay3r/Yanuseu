name: Yanuseu
options:
  bundleIdPrefix: cool.n0thing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Yanuseu:
    type: application
    platform: iOS
    sources:
      - path: Sources/Yanuseu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.n0thing.yanuseu
        INFOPLIST_KEY_CFBundleDisplayName: Yanuseu
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - YanuseuTests
  YanuseuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/YanuseuTests
    dependencies:
      - target: Yanuseu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.n0thing.yanuseu.tests
        GENERATE_INFOPLIST_FILE: YES
