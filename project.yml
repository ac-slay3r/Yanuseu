name: Janus
options:
  bundleIdPrefix: cool.n0thing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Janus:
    type: application
    platform: iOS
    sources:
      - path: Sources/Janus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.n0thing.janus
        INFOPLIST_KEY_CFBundleDisplayName: Janus
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
  JanusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/JanusTests
    dependencies:
      - target: Janus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.n0thing.janus.tests
        GENERATE_INFOPLIST_FILE: YES
