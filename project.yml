name: Yanuseu
options:
  bundleIdPrefix: cool.n0thing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  fileTypes:
    xcprivacy:
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Yanuseu:
    type: application
    platform: iOS
    sources:
      - path: Sources/Yanuseu
    info:
      path: Sources/Yanuseu/Info.plist
      properties:
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Yanuseu
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.n0thing.yanus
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      archive:
        config: Release
      testTargets:
        - YanuseuTests
  YanuseuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/YanuseuTests
    dependencies:
      - target: Yanuseu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.n0thing.yanus.tests
        GENERATE_INFOPLIST_FILE: YES
