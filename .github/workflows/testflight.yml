name: Manual TestFlight distribution

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA with successful unsigned iOS CI (push or dispatch)
        required: true
        type: string
      version:
        description: CFBundleShortVersionString (major.minor.patch)
        required: true
        type: string
      build_number:
        description: CFBundleVersion; must be unused and greater than previous ASC builds
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: yanuseu-testflight
  cancel-in-progress: false

jobs:
  gate-ci:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and exact CI result
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          sha = os.environ['RELEASE_SHA']
          version = os.environ['RELEASE_VERSION']
          build = os.environ['RELEASE_BUILD']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,2}', version) or not re.fullmatch(r'[1-9][0-9]*', build):
              raise SystemExit('Invalid release SHA, version, or build number')
          repo = os.environ['GITHUB_REPOSITORY']
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          if get('/git/ref/heads/main').get('object', {}).get('sha') != sha:
              raise SystemExit('Release SHA must be the current main commit')
          query = urllib.parse.urlencode({'head_sha': sha, 'status': 'success', 'per_page': 100})
          runs = get('/actions/workflows/ios.yml/runs?' + query).get('workflow_runs', [])
          if not any(r.get('head_sha') == sha and r.get('conclusion') == 'success'
                     and r.get('head_branch') == 'main' and r.get('event') in ('push', 'workflow_dispatch') for r in runs):
              raise SystemExit('No successful unsigned iOS CI run for this main SHA')
          PY

  distribute:
    needs: gate-ci
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Select Xcode and generate project
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          brew install xcodegen
          xcodegen generate
      - name: Sign, verify, and upload to App Store Connect
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
          APP_DISTRIBUTION_P12_BASE64: ${{ secrets.APP_DISTRIBUTION_P12_BASE64 }}
          APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APP_DISTRIBUTION_P12_PASSWORD }}
          YANUSEU_APP_PROFILE_BASE64: ${{ secrets.YANUSEU_APP_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_P8: ${{ secrets.ASC_API_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          WORK="$(mktemp -d "$RUNNER_TEMP/yanuseu-release.XXXXXXXX")"
          KEYCHAIN="$WORK/release.keychain-db"
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          PROFILE_DEST=""
          API_KEY_DIR="$HOME/.private_keys"
          API_KEY_FILE=""
          cleanup() {
            if [[ -n "${API_KEY_FILE:-}" ]]; then rm -f "$API_KEY_FILE"; fi
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            if [[ -n "$PROFILE_DEST" ]]; then rm -f "$PROFILE_DEST"; fi
            rm -rf "$WORK"
          }
          trap cleanup EXIT
          python3 tools/testflight_release.py inputs "$RELEASE_SHA" "$RELEASE_VERSION" "$RELEASE_BUILD"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python3 tools/testflight_release.py preflight
          umask 077
          printf '%s' "$APP_DISTRIBUTION_P12_BASE64" | base64 -D > "$WORK/distribution.p12"
          printf '%s' "$YANUSEU_APP_PROFILE_BASE64" | base64 -D > "$WORK/profile.mobileprovision"
          printf '%s' "$ASC_API_PRIVATE_KEY_P8" > "$WORK/AuthKey_${ASC_API_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$WORK/distribution.p12" -k "$KEYCHAIN" -P "$APP_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          python3 tools/testflight_release.py check-identity "$WORK/profile.mobileprovision" "$KEYCHAIN"
          python3 tools/testflight_release.py export-options "$WORK/ExportOptions.plist" "$WORK/profile.mobileprovision"
          PROFILE_UUID="$(python3 -c 'import plistlib,subprocess,sys; print(plistlib.loads(subprocess.check_output(["security","cms","-D","-i",sys.argv[1]]))["UUID"])' "$WORK/profile.mobileprovision")"
          mkdir -p "$PROFILE_DIR"
          PROFILE_CANDIDATE="$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          if [[ -e "$PROFILE_CANDIDATE" ]]; then echo 'Provisioning profile destination already exists; refusing overwrite' >&2; exit 1; fi
          cp "$WORK/profile.mobileprovision" "$PROFILE_CANDIDATE"
          PROFILE_DEST="$PROFILE_CANDIDATE"
          xcodebuild archive -project Yanuseu.xcodeproj -scheme Yanuseu -configuration Release -destination 'generic/platform=iOS' -archivePath "$WORK/Yanuseu.xcarchive" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=VYJS7JMXU5 PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CODE_SIGN_IDENTITY='Apple Distribution' MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$RELEASE_BUILD"
          python3 tools/testflight_release.py verify-archive "$WORK/Yanuseu.xcarchive/Products/Applications/Yanuseu.app" "$RELEASE_VERSION" "$RELEASE_BUILD" "$WORK/profile.mobileprovision"
          xcodebuild -exportArchive -archivePath "$WORK/Yanuseu.xcarchive" -exportPath "$WORK/export" -exportOptionsPlist "$WORK/ExportOptions.plist"
          IPA="$WORK/export/Yanuseu.ipa"
          test -f "$IPA"
          python3 tools/testflight_release.py verify-ipa "$IPA" "$RELEASE_VERSION" "$RELEASE_BUILD" "$WORK/profile.mobileprovision"
          mkdir -p "$API_KEY_DIR"
          if [[ -e "$API_KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8" ]]; then echo 'ASC API key destination already exists; refusing overwrite' >&2; exit 1; fi
          mv "$WORK/AuthKey_${ASC_API_KEY_ID}.p8" "$API_KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          API_KEY_FILE="$API_KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --validate-app --type ios -f "$IPA" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
