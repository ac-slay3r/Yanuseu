name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-bundle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Compile app and unit-test bundles for iOS Simulator
        run: xcodebuild build-for-testing -project Yanuseu.xcodeproj -scheme Yanuseu -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
